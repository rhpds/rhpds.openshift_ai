---
ocp4_workload_openshift_ai_dashboard_config_settings:
  disableTracking: false
  disableModelRegistry: false
  disableModelCatalog: false
  disableKServeMetrics: false
  genAiStudio: true
  modelAsService: true
  disableLMEval: false

ocp4_workload_openshift_ai_dashboard_config_notebook_controller:
  enabled: true
  pvcSize: 20Gi

ocp4_workload_openshift_ai_hardware_profile_gpu_identifiers:
- defaultCount: '1'
  displayName: CPU
  identifier: cpu
  maxCount: '8'
  minCount: 1
  resourceType: CPU
- defaultCount: 12Gi
  displayName: Memory
  identifier: memory
  maxCount: 16Gi
  minCount: 1Gi
  resourceType: Memory
- defaultCount: 1
  displayName: GPU
  identifier: nvidia.com/gpu
  maxCount: 4
  minCount: 1
  resourceType: Accelerator

# GatewayConfig cookie settings
# These must be less than Keycloak session timeout to prevent redirect loops
# Default Keycloak SSO Session Idle is 5 minutes (300 seconds)
ocp4_workload_openshift_ai_dashboard_config_gateway_cookie_expire: 24h0m0s
ocp4_workload_openshift_ai_dashboard_config_gateway_cookie_refresh: 1h0m0s

